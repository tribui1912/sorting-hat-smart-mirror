<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0c0a09">
<title>Sorting Hat Override</title>
<style>
  :root {
    --bg: #0c0a09; --panel: #1c1917; --line: #292524; --text: #f5f5f4; --muted: #a8a29e;
    --ok: #4ade80; --bad: #f87171; --warn: #fbbf24;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 16px/1.3 -apple-system, system-ui, "Segoe UI", Roboto, sans-serif; padding-bottom: 96px; }
  header { position: sticky; top: 0; z-index: 2; background: var(--bg); padding: 12px 16px 8px;
           border-bottom: 1px solid var(--line); }
  h1 { font-size: 17px; margin: 0 0 6px; letter-spacing: .02em; }
  .status { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; color: var(--muted); }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--muted);
         margin-right: 5px; vertical-align: 0; }
  .dot.ok { background: var(--ok); } .dot.bad { background: var(--bad); } .dot.warn { background: var(--warn); }
  #state { color: var(--text); font-weight: 600; }
  main { padding: 12px 16px; }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); margin: 18px 0 8px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
  button { font: inherit; color: var(--text); border: 0; border-radius: 12px; cursor: pointer;
           min-height: 58px; padding: 10px 12px; text-align: left; position: relative; overflow: hidden;
           background: var(--panel); transition: transform .08s, filter .15s; }
  button:active { transform: scale(.97); filter: brightness(1.3); }
  button .name { font-weight: 600; font-size: 17px; display: block; }
  button .house { font-size: 12px; opacity: .8; display: block; margin-top: 2px; }
  button.person { border-left: 6px solid var(--c); background: linear-gradient(90deg, color-mix(in srgb, var(--c) 30%, var(--panel)), var(--panel)); }
  button.guest { text-align: center; background: color-mix(in srgb, var(--c) 45%, var(--panel)); font-weight: 600; }
  .row { display: flex; gap: 10px; }
  .row button { flex: 1; text-align: center; font-weight: 600; }
  #stop { background: #7f1d1d; }
  #rec.on { background: #14532d; } #rec.off { background: #44403c; }
  footer { position: fixed; bottom: 0; left: 0; right: 0; padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
           background: var(--bg); border-top: 1px solid var(--line); }
  #toast { position: fixed; left: 50%; top: 84px; transform: translateX(-50%); background: #fafaf9; color: #0c0a09;
           padding: 8px 14px; border-radius: 999px; font-size: 14px; font-weight: 600; opacity: 0;
           transition: opacity .2s; pointer-events: none; z-index: 3; white-space: nowrap; }
  #toast.show { opacity: 1; }
  #toast.err { background: var(--bad); }
</style>
</head>
<body>
<header>
  <h1>Sorting Hat — Override</h1>
  <div class="status">
    <span><span id="state">connecting…</span></span>
    <span><span id="hatdot" class="dot"></span>hat</span>
    <span><span id="recdot" class="dot"></span>recognition</span>
    <span id="last"></span>
  </div>
</header>
<main>
  <h2>Friends — tap to sort</h2>
  <div class="grid" id="people"></div>
  <h2>Guests — not enrolled</h2>
  <div class="grid" id="guests"></div>
</main>
<footer>
  <div class="row">
    <button id="rec" class="off">Recognition: …</button>
    <button id="stop">Stop</button>
  </div>
</footer>
<div id="toast"></div>
<script>
  const token = new URLSearchParams(location.search).get("token") || "";
  const headers = { "Content-Type": "application/json", "X-Token": token };
  const $ = (id) => document.getElementById(id);
  let houses = {}, recEnabled = false;

  async function api(path, body) {
    const opts = body === undefined ? { headers } : { method: "POST", headers, body: JSON.stringify(body) };
    const res = await fetch(path, opts);
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || data.reason || res.status);
    return data;
  }

  function toast(msg, err) {
    const t = $("toast");
    t.textContent = msg; t.className = "show" + (err ? " err" : "");
    clearTimeout(toast.timer); toast.timer = setTimeout(() => (t.className = ""), 1800);
  }

  async function reveal(body, label) {
    if (navigator.vibrate) navigator.vibrate(30);
    try { await api("/api/reveal", body); toast("Sorting " + label); }
    catch (e) { toast(e.message, true); }
    poll();
  }

  function button(cls, color, html, onTap) {
    const b = document.createElement("button");
    b.className = cls; b.style.setProperty("--c", color); b.innerHTML = html;
    b.addEventListener("click", onTap);
    return b;
  }

  const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  async function load() {
    const data = await api("/api/people");
    houses = data.houses;
    const grid = $("people"); grid.innerHTML = "";
    for (const p of data.people) {
      const h = houses[p.house];
      grid.append(button("person", h.primary,
        `<span class="name">${esc(p.name)}</span><span class="house">${esc(h.label)} · #${p.id}</span>`,
        () => reveal({ id: p.id }, p.name)));
    }
    if (!data.people.length) grid.innerHTML = '<p style="color:var(--muted)">No one in people.json yet.</p>';
    const guests = $("guests"); guests.innerHTML = "";
    for (const [key, h] of Object.entries(houses))
      guests.append(button("guest", h.primary, esc(h.label), () => reveal({ house: key }, "guest → " + h.label)));
    guests.append(button("guest", "#57534e", "Random", () => reveal({ house: "random" }, "guest → random")));
  }

  async function poll() {
    try {
      const s = await api("/api/status");
      $("state").textContent = s.state + (s.person ? " · " + s.person : s.house ? " · guest " + s.house : "")
        + (s.audio && s.audio !== "hat" ? " (audio: " + s.audio + ")" : "");
      $("hatdot").className = "dot " + (s.hat_online === true ? "ok" : s.hat_online === false ? "bad" : "");
      recEnabled = s.recognition_enabled;
      $("recdot").className = "dot " + (!s.recognition_available ? "bad" : recEnabled ? "ok" : "warn");
      const rec = $("rec");
      rec.disabled = !s.recognition_available;
      rec.className = recEnabled ? "on" : "off";
      rec.textContent = !s.recognition_available ? "Recognition: unavailable" : "Recognition: " + (recEnabled ? "ON" : "OFF");
      const m = s.last_match;
      $("last").textContent = m ? `last: ${m.label} (${m.score.toFixed(2)}, ${m.ago_s}s ago)` : "";
    } catch (e) {
      $("state").textContent = "offline";
      $("hatdot").className = $("recdot").className = "dot";
    }
  }

  $("stop").addEventListener("click", async () => {
    try { await api("/api/stop", {}); toast("Stopped"); } catch (e) { toast(e.message, true); }
    poll();
  });
  $("rec").addEventListener("click", async () => {
    try { await api("/api/recognition", { enabled: !recEnabled }); } catch (e) { toast(e.message, true); }
    poll();
  });

  load().catch((e) => toast("Can't load people: " + e.message, true));
  poll(); setInterval(poll, 1500);
</script>
</body>
</html>
